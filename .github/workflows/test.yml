name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build ./cmd/dsh-auth-gateway
      - run: python3 scripts/check_caddy_templates.py
      - run: python3 scripts/test_audit_fail_closed.py
      - name: Validate Caddy examples
        run: |
          sudo apt-get update
          sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
          sudo apt-get update
          sudo apt-get install -y caddy
          caddy validate --config configs/Caddyfile.example --adapter caddyfile
          caddy validate --config configs/Caddyfile.private-http.example --adapter caddyfile
